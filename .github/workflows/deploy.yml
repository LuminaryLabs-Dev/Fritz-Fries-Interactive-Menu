name: Build and deploy Next.js

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fritz-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_BASE_PATH: /Fritz-Fries-Interactive-Menu
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install dependencies
        run: |
          if test -f package-lock.json; then npm ci; else npm install; fi
      - run: npm test
      - run: npm run build
      - run: npm run validate:static
      - name: Publish validated export to repository root
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run publish:root
      - name: Commit generated Pages root
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!source'
          git add .pages-generated.json .nojekyll 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Generated Pages root already matches validated build."
          else
            git commit -m "build: publish validated static Pages output [skip ci]"
            git push origin HEAD:main
          fi
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Capture the original website
        continue-on-error: true
        run: npm run capture:reference
      - name: Package reproducible local runtime
        run: |
          mkdir -p validation
          tar -czf validation/runtime-pack.tgz node_modules package-lock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fritz-build-evidence
          include-hidden-files: true
          path: |
            source/out/
            source/reference/
            source/package-lock.json
            source/validation/runtime-pack.tgz
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: source/out

  deploy:
    if: github.event_name != 'pull_request' && vars.PUBLISH_DEMO == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
